name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app
        env:
          UNIVERSAL: "1"
          VERSION: 0.0.0-dev
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim
          path: dist/*.zip
